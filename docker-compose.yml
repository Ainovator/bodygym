name: feetwork
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feetwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feetwork_local}
      POSTGRES_DB: ${POSTGRES_DB:-feetwork}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5438}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER:-feetwork}:${POSTGRES_PASSWORD:-feetwork_local}@postgres:5432/${POSTGRES_DB:-feetwork}?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-feetwork}:${POSTGRES_PASSWORD:-feetwork_local}@postgres:5432/${POSTGRES_DB:-feetwork}?sslmode=disable
      HTTP_ADDR: :8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5178}
    ports:
      - "127.0.0.1:${API_PORT:-8088}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    init: true
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend-check:
    profiles: ["tools"]
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    command: ["sh", "-c", "go test ./... && go vet ./..."]
volumes:
  postgres_data:
  go_modules:
  go_build:
